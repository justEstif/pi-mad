# Edit values directly; they are plain defaults.
#
# Config surface for {skill-name}.
# Emitted only when the author opted in during build; otherwise the agent
# ships hardcoded paths and no config file.

[agent]

{if-customizable}
# For memory/autonomous agents: your sanctum (PERSONA/CREED/BOND/CAPABILITIES)
# is the primary behavior surface. Prefer editing sanctum files over this file.

# Steps to run before the standard activation (config load, greet).
# Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the agent accepts user input.
# Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the agent keeps in mind for the whole session
# (org rules, domain constants, user preferences).
# These are static context loaded on activation. They are not
# the sanctum: the sanctum is the agent's runtime memory across wakings,
# a separate surface that lives under memory/{skillName}/ in the project
# working directory.
#
# Each entry is either:
#   - a literal sentence, e.g. "Our org is AWS-only -- do not propose GCP or Azure."
#   - a file reference prefixed with `file:`, e.g. "file:docs/standards.md"
#     (paths resolve from the project working directory; glob patterns are
#     supported; the file's contents are loaded and treated as facts).

persistent_facts = []

# --- Agent-specific configurables (lifted during Configurability Discovery) ---
#
# Swappable reference docs, output paths, or hooks the builder surfaced with
# the author. Paths inside the skill are bare from the skill root; paths
# outside point into the project working directory.
#
# Naming conventions:
#   *_template        -- file paths for templates the agent loads
#   *_output_path     -- writable destinations
#   on_<event>        -- hook scalars (prompts/commands)

{/if-customizable}
